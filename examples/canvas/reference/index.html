<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbital study</title><link rel="icon" href="data:,"><style>*{box-sizing:border-box}body{margin:0;background:oklch(96% .018 90);color:oklch(27% .035 155);font-family:Georgia,serif}main{width:min(1120px,calc(100% - 64px));margin:64px auto}header{border-bottom:1px solid #bbc6bb;padding-bottom:24px;margin-bottom:40px}.eyebrow{font:600 12px/1.5 Verdana,sans-serif;letter-spacing:.14em;text-transform:uppercase}h1{font-size:56px;line-height:1.05;font-weight:400;letter-spacing:-.035em;margin:16px 0}h2{font-size:26px;font-weight:400;margin:0 0 16px}p{font-size:18px;line-height:1.6;max-width:640px}button,input{font:15px/1.4 Verdana,sans-serif}button{min-height:44px;border:1px solid #859d8b;background:transparent;padding:10px 18px;color:inherit;cursor:pointer}button:hover{background:#d8e5d9}button:focus-visible,input:focus-visible{outline:3px solid #d17036;outline-offset:3px}button[aria-selected=true]{background:#244c3a;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.tile{border-top:2px solid #244c3a;padding-top:20px}.tile p{font-size:16px}img{display:block;width:100%;height:140px;object-fit:cover;margin-bottom:24px}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.panel{border-top:1px solid #bbc6bb;padding:24px 0;min-height:140px}input{padding:12px;width:min(100%,360px);background:white;border:1px solid #859d8b}dialog{border:1px solid #859d8b;padding:32px;max-width:calc(100% - 40px);background:#f5f4e9;color:#244c3a}dialog::backdrop{background:#14261a66}canvas{display:block;width:100%;height:360px;background:#183e32}.note{font:14px/1.6 Verdana,sans-serif;margin-top:24px}[hidden]{display:none!important}@media(max-width:640px){main{width:calc(100% - 40px);margin:32px auto}h1{font-size:38px}.grid{grid-template-columns:1fr;gap:32px}header{margin-bottom:28px}canvas{height:260px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style><main><header><div class="eyebrow">03 / Dynamic canvas</div><h1>Orbital study</h1><p>A deterministic orbit with live motion, pause, resume and a repeatable reset state.</p></header><canvas id="orbit" width="960" height="360" aria-label="Orbiting dots"></canvas><div class="controls"><button id="pause">Pause</button><button id="reset">Reset to still</button></div><p class="note" id="status"></p></main><script>const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),button=document.querySelector('#pause'),status=document.querySelector('#status'),reduce=matchMedia('(prefers-reduced-motion: reduce)');let phase=0,paused=reduce.matches,last=performance.now();function labels(){button.textContent=paused?'Resume':'Pause';status.textContent=reduce.matches?'Reduced motion: still':paused?'Paused':'Running'}function draw(){ctx.fillStyle='#183e32';ctx.fillRect(0,0,960,360);for(let i=0;i<12;i++){const a=phase+i*Math.PI/6,r=90+i%3*18;ctx.fillStyle=i%3===0?'#e4a26a':'#dce7c8';ctx.beginPath();ctx.arc(480+Math.cos(a)*r*2.3,180+Math.sin(a)*r,8+i%3*3,0,Math.PI*2);ctx.fill()}}function tick(now){if(!paused&&!reduce.matches)phase+=Math.min((now-last)/1000,.04)*.6;last=now;draw();requestAnimationFrame(tick)}button.onclick=()=>{paused=!paused;labels()};document.querySelector('#reset').onclick=()=>{paused=true;phase=0;draw();labels()};reduce.onchange=()=>{paused=reduce.matches;phase=0;labels()};labels();draw();requestAnimationFrame(tick);</script></html>
